<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaFinance - Pro Edition (With Charts)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #1f2937; --border: #e5e7eb; --sidebar: #1e3c72; }
        body.dark-mode { --bg: #111827; --card: #1f2937; --text: #f9fafb; --border: #374151; --sidebar: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        #auth-screen { max-width: 400px; margin: 100px auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        #auth-screen input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 5px; }
        #auth-screen button { width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: 700; }
        .btn-login { background: #3b82f6; color: white; } .btn-register { background: #11998e; color: white; }
        #app { display: none; width: 100%; }
        .sidebar { width: 240px; background: var(--sidebar); color: white; padding: 20px; box-sizing: border-box; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); }
        .content { flex: 1; padding: 30px; box-sizing: border-box; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: 700; }
        .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        .csv-btn { background: #f7971e; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: 700; margin-right: 10px; }
        .insight-bar { background: var(--card); padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .health-card { background: linear-gradient(135deg, #8e2de2, #4a00e0); padding: 20px; border-radius: 12px; margin-bottom: 20px; color: white; }
        .health-card h4 { opacity: 0.8; } .health-card .score { font-size: 50px; font-weight: 800; margin: 10px 0; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat { padding: 20px; border-radius: 10px; color: white; }
        .stat h4 { font-size: 14px; opacity: 0.9; margin-bottom: 5px; } .stat span { font-size: 28px; font-weight: 800; }
        .bg-green { background: #11998e; } .bg-red { background: #ff4b2b; } .bg-blue { background: #3b82f6; } .bg-yellow { background: #f7971e; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h3 { margin-bottom: 15px; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
        input, select { padding: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 5px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-add { background: #11998e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: 700; }
        .btn-edit { background: #3b82f6; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-pay { background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .empty-state { color: var(--text); opacity: 0.6; text-align: center; padding: 20px; }
        .budget-alert { background: #ef4444; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .calc-box { background: var(--bg); padding: 15px; border-radius: 8px; margin-top: 10px; } .calc-box p { margin: 5px 0; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <h2 style="text-align:center; margin-bottom: 20px;">NexaFinance</h2>
        <input id="auth-user" placeholder="Username"><input id="auth-email" placeholder="Email"><input id="auth-pass" type="password" placeholder="Password">
        <button class="btn-login" onclick="login()">Login</button><button class="btn-register" onclick="register()">Register</button>
        <p id="auth-msg" style="color:red; text-align:center; margin-top:10px; display:none;">Error</p>
    </div>

    <div id="app">
        <div class="sidebar">
            <div class="logo"><i class="fas fa-cube"></i> NexaFinance</div>
            <div class="nav-item active" onclick="showPage('overview')"><i class="fas fa-th-large"></i> Overview</div>
            <div class="nav-item" onclick="showPage('income')"><i class="fas fa-chart-line"></i> Income</div>
            <div class="nav-item" onclick="showPage('expense')"><i class="fas fa-receipt"></i> Expenses</div>
            <div class="nav-item" onclick="showPage('budget')"><i class="fas fa-piggy-bank"></i> Budgets</div>
            <div class="nav-item" onclick="showPage('recurring')"><i class="fas fa-sync-alt"></i> Recurring</div>
            <div class="nav-item" onclick="showPage('savings')"><i class="fas fa-vault"></i> Savings</div>
            <div class="nav-item" onclick="showPage('loans')"><i class="fas fa-hand-holding-usd"></i> Loans</div>
            <div class="nav-item" onclick="showPage('assets')"><i class="fas fa-building"></i> Assets</div>
            <div class="nav-item" onclick="showPage('analytics')"><i class="fas fa-chart-pie"></i> Can I Afford It?</div>
            <div class="nav-item" onclick="showPage('tax')"><i class="fas fa-calculator"></i> Tax Estimator</div>
        </div>
        <div class="content">
            <div class="top-header">
                <h2 id="page-title">Overview</h2>
                <div>
                    <button class="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
                    <button class="csv-btn" onclick="exportCSV()"><i class="fas fa-file-csv"></i> Export CSV</button>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
            <div id="main"></div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:5000/api";
        let token = localStorage.getItem('token') || '';
        let currentPage = 'overview';
        let data = { txns: [], budgets: [], goals: [], loans: [], recurring: [], assets: [] };

        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        function toggleTheme() { document.body.classList.toggle('dark-mode'); const isDark = document.body.classList.contains('dark-mode'); localStorage.setItem('theme', isDark ? 'dark' : 'light'); document.querySelector('.theme-btn i').className = isDark ? 'fas fa-sun' : 'fas fa-moon'; }

        if (token) showApp(); else showAuth();
        function showAuth() { document.getElementById('auth-screen').style.display='block'; document.getElementById('app').style.display='none'; }
        function showApp() { document.getElementById('auth-screen').style.display='none'; document.getElementById('app').style.display='flex'; loadAll(); }

        async function register() {
            const u=document.getElementById('auth-user').value, e=document.getElementById('auth-email').value, p=document.getElementById('auth-pass').value;
            let res=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:e,password:p})});
            document.getElementById('auth-msg').style.display='block'; document.getElementById('auth-msg').textContent='Registered! Now login.';
        }
        async function login() {
            const u=document.getElementById('auth-user').value, p=document.getElementById('auth-pass').value;
            let res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
            let d=await res.json();
            if(d.access_token){ token=d.access_token; localStorage.setItem('token',token); showApp(); }
            else { document.getElementById('auth-msg').style.display='block'; document.getElementById('auth-msg').textContent='Login failed'; }
        }
        function logout(){ localStorage.removeItem('token'); location.reload(); }

        async function api(end, method='GET', body=null) {
            let headers={'Authorization':'Bearer '+token}; if(body) headers['Content-Type']='application/json';
            let res=await fetch(API+end,{method,headers,body:body?JSON.stringify(body):null});
            if(res.status === 401 || res.status === 422) { localStorage.removeItem('token'); location.reload(); return; }
            return res.json();
        }

        async function loadAll() {
            data.txns = await api('/transactions');
            data.budgets = await api('/budgets');
            data.goals = await api('/savings-goals');
            data.loans = await api('/loans');
            data.recurring = await api('/recurring');
            data.assets = await api('/assets');
            applyRecurring();
            render();
        }

        async function applyRecurring() {
            const today = new Date(); const m = today.getMonth()+1; const y = today.getFullYear();
            for (const rec of data.recurring) {
                const alreadyAdded = data.txns.some(t => t.type === 'expense' && t.description === rec.name && t.date.startsWith(`${y}-${String(m).padStart(2,'0')}`));
                if (!alreadyAdded) {
                    const dateStr = `${y}-${String(m).padStart(2,'0')}-01`;
                    const newTxn = await api('/transactions', 'POST', { type: 'expense', amount: rec.amount, category: rec.category, description: rec.name, date: dateStr });
                    if (newTxn) data.txns.unshift(newTxn);
                }
            }
        }

        function exportCSV() {
            let csv = "Type,Description,Category,Amount,Date\n";
            data.txns.forEach(t => csv += `${t.type},${t.description},${t.category},${t.amount},${t.date}\n`);
            const encodedUri = encodeURI(csv); const link = document.createElement("a"); link.setAttribute("href", encodedUri); link.setAttribute("download", "NexaFinance_Export.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function showPage(page) { currentPage=page; document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); event.currentTarget.classList.add('active'); render(); }

        function render() {
            const main=document.getElementById('main'); document.getElementById('page-title').innerText = currentPage.charAt(0).toUpperCase() + currentPage.slice(1);

            // *** OVERVIEW PAGE (NOW WITH ALL 3 CHARTS) ***
            if(currentPage==='overview') {
                let inc=data.txns.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
                let exp=data.txns.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
                let save=inc-exp;
                let rate = inc > 0 ? ((save / inc) * 100).toFixed(1) : 0;
                let healthScore = inc > 0 ? (Math.min(100, Math.max(0, 50 + (rate - 20) * 2))) : 0;

                // Prepare Data for Pie Chart (Category Breakdown)
                let catMap = {};
                data.txns.forEach(t => { if(t.type === 'expense') catMap[t.category] = (catMap[t.category] || 0) + t.amount; });
                let catLabels = Object.keys(catMap);
                let catValues = Object.values(catMap);

                // Prepare Data for Daily Spending Trend
                let sortedDates = [...data.txns].filter(t=>t.type==='expense').map(t=>t.date).sort();

                main.innerHTML=`<div class="insight-bar"><i class="fas fa-lightbulb" style="color:#f7971e;"></i> You're saving ${rate}% of your income.</div>
                <div class="health-card"><h4>Financial Health Score</h4><div class="score">${healthScore}<span style="font-size:20px;">/100</span></div><div style="font-size:14px; opacity:0.8;">Savings Rate (40%) | Budget (20%) | Expense Control (20%) | Debt (10%) | Goals (10%)</div></div>
                <div class="grid-4">
                    <div class="stat bg-green"><h4>Total Income</h4><span>₹${inc.toLocaleString('en-IN')}</span></div>
                    <div class="stat bg-red"><h4>Total Expenses</h4><span>₹${exp.toLocaleString('en-IN')}</span></div>
                    <div class="stat bg-blue"><h4>Monthly Savings</h4><span>₹${save.toLocaleString('en-IN')}</span></div>
                    <div class="stat bg-yellow"><h4>Net Balance</h4><span>₹${save.toLocaleString('en-IN')}</span></div>
                </div>
                <div class="grid-2"><div class="card"><h3>Recent Activity</h3><table><tr><th>Description</th><th>Amount</th><th>Date</th></tr>${data.txns.slice(0,5).map(t=>`<tr><td>${t.description}</td><td>₹${t.amount.toLocaleString('en-IN')}</td><td>${t.date}</td></tr>`).join('')}</table></div><div class="card"><h3>Monthly Flow</h3><canvas id="chart1" height="200"></canvas></div></div>
                <div class="grid-2" style="margin-top: 20px;"><div class="card"><h3>Category Breakdown</h3><canvas id="chart2" height="200"></canvas></div><div class="card"><h3>Daily Spending Trend</h3><canvas id="chart3" height="200"></canvas></div></div>`;

                // Bar Chart
                new Chart(document.getElementById('chart1'), { type:'bar', data:{labels:['Income','Expense'], datasets:[{data:[inc,exp], backgroundColor:['#11998e','#ff4b2b']}]} });
                // Pie / Doughnut Chart
                new Chart(document.getElementById('chart2'), { type:'doughnut', data:{labels:catLabels, datasets:[{data:catValues, backgroundColor:['#11998e','#f7971e','#3b82f6','#ef4444','#8e2de2','#28a745']}]} });
                // Line Chart
                new Chart(document.getElementById('chart3'), { type:'line', data:{labels:sortedDates, datasets:[{data:sortedDates.map(d => data.txns.find(t => t.date === d && t.type==='expense')?.amount || 0), borderColor:'#ff4b2b', backgroundColor:'rgba(255,75,43,0.2)', fill:true, tension: 0.4}]} });
            }

            // INCOME / EXPENSE (UNCHANGED)
            if(currentPage==='income' || currentPage==='expense') {
                let type = currentPage==='income'?'income':'expense';
                let list=data.txns.filter(t=>t.type===type);
                let categories = ['Salary','Rent','Freelance','Business','Investment','Other','Bills','Groceries','Transport','Shopping','Healthcare','Education','Entertainment','Travel'];
                main.innerHTML=`<div class="card"><h3>Add ${type}</h3><div class="form-row"><input id="desc" placeholder="Description"><input id="amt" type="number" placeholder="Amount"><select id="cat">${categories.map(c=>`<option value="${c}">${c}</option>`).join('')}</select><input id="date" type="date"><button class="btn-add" onclick="addTxn('${type}')">Add</button></div></div>
                <div class="card"><h3>${type} History</h3><table><tr><th>Description</th><th>Category</th><th>Amount</th><th>Date</th><th>Actions</th></tr>${list.map(t=>`<tr><td>${t.description}</td><td>${t.category}</td><td>₹${t.amount}</td><td>${t.date}</td><td><button class="btn-edit" onclick="editTxn(${t.id})">Edit</button> <button class="btn-delete" onclick="delTxn(${t.id})">Delete</button></td></tr>`).join('')}</table></div>`;
            }

            // BUDGETS (UNCHANGED)
            if(currentPage==='budget') {
                let budgetAlerts = ''; let budgetRows = data.budgets.map(b => {
                    let spent = data.txns.filter(t => t.type === 'expense' && t.category === b.category).reduce((a, c) => a + c.amount, 0);
                    let pct = (spent / b.amount * 100).toFixed(1); let status = "Within Budget"; let statusColor = "#11998e";
                    if (spent > b.amount) { status = "Over Budget!"; statusColor = "#ef4444"; budgetAlerts += `<div class="budget-alert"><i class="fas fa-exclamation-triangle"></i> Alert: You have exceeded the <strong>${b.category}</strong> budget by <strong>₹${(spent - b.amount).toLocaleString('en-IN')}</strong>!</div>`; }
                    else if (pct >= 90) { status = "Near Limit"; statusColor = "#f7971e"; } else if (pct >= 70) { status = "Watch Spending"; statusColor = "#f7971e"; }
                    return `<tr><td>${b.category}</td><td>₹${b.amount.toLocaleString('en-IN')}</td><td>₹${spent.toLocaleString('en-IN')}</td><td style="color:${statusColor};font-weight:bold;">${status} (${pct}%)</td><td><button class="btn-edit" onclick="editBudget(${b.id})">Edit</button> <button class="btn-delete" onclick="delBudget(${b.id})">Delete</button></td></tr>`;
                }).join('');
                main.innerHTML = `${budgetAlerts}<div class="card"><h3>Set Budget</h3><div class="form-row"><input id="bcat" placeholder="Category"><input id="bamt" type="number" placeholder="Limit"><button class="btn-add" onclick="addBudget()">Add</button></div></div>
                <div class="card"><h3>Budgets</h3><table><tr><th>Category</th><th>Limit</th><th>Spent</th><th>Status</th><th>Actions</th></tr>${budgetRows}</table></div>`;
            }

            // RECURRING (NEW)
            if(currentPage==='recurring') {
                main.innerHTML=`<div class="card"><h3>Add Recurring Expense</h3><div class="form-row"><input id="rname" placeholder="Name"><input id="ramt" type="number" placeholder="Amount"><select id="rcat"><option>Other</option><option>Rent</option><option>Food</option><option>Transport</option><option>Bills</option></select><select id="rfreq"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option></select><button class="btn-add" onclick="addRecurring()">Add</button></div></div>
                <div class="card"><h3>Recurring Expenses</h3><table><tr><th>Name</th><th>Amount</th><th>Category</th><th>Frequency</th><th>Next Due</th><th>Actions</th></tr>${data.recurring.map(r=>`<tr><td>${r.name}</td><td>₹${r.amount.toLocaleString('en-IN')}</td><td>${r.category}</td><td>${r.frequency}</td><td>${r.next_due_date}</td><td><button class="btn-edit" onclick="editRecurring(${r.id})">Edit</button> <button class="btn-delete" onclick="delRecurring(${r.id})">Delete</button></td></tr>`).join('')}</table></div>`;
            }

            // SAVINGS (UNCHANGED)
            if(currentPage==='savings') {
                main.innerHTML=`<div class="card"><h3>Add Goal</h3><div class="form-row"><input id="gname" placeholder="Goal Name"><input id="gtarget" type="number" placeholder="Target"><input id="gsaved" type="number" placeholder="Saved"><button class="btn-add" onclick="addGoal()">Add</button></div></div>
                <div class="card"><h3>Goals</h3><table><tr><th>Name</th><th>Target</th><th>Saved</th><th>Actions</th></tr>${data.goals.map(g=>`<tr><td>${g.name}</td><td>₹${g.target_amount}</td><td>₹${g.saved_amount}</td><td><button class="btn-edit" onclick="editGoal(${g.id})">Edit</button> <button class="btn-delete" onclick="delGoal(${g.id})">Delete</button></td></tr>`).join('')}</table></div>`;
            }

            // LOANS (UNCHANGED)
            if(currentPage==='loans') {
                main.innerHTML=`<div class="card"><h3>Add Loan</h3><div class="form-row"><input id="lname" placeholder="Loan Name"><input id="lprincipal" type="number" placeholder="Principal"><input id="lemn" type="number" placeholder="EMI"><input id="ltenure" type="number" placeholder="Tenure"><button class="btn-add" onclick="addLoan()">Add</button></div></div>
                <div class="card"><h3>Loans</h3><table><tr><th>Name</th><th>Outstanding</th><th>EMI</th><th>Actions</th></tr>${data.loans.map(l=>`<tr><td>${l.name}</td><td>₹${l.outstanding_amount}</td><td>₹${l.monthly_emi}</td><td><button class="btn-edit" onclick="editLoan(${l.id})">Edit</button> <button class="btn-pay" onclick="payEMI(${l.id})">Pay EMI</button> <button class="btn-delete" onclick="delLoan(${l.id})">Delete</button></td></tr>`).join('')}</table></div>`;
            }

            // ASSETS (NEW)
            if(currentPage==='assets') {
                main.innerHTML=`<div class="card"><h3>Add Asset</h3><div class="form-row"><input id="aname" placeholder="Asset Name (e.g. Bank, Car)"><input id="aval" type="number" placeholder="Value"><button class="btn-add" onclick="addAsset()">Add</button></div></div>
                <div class="card"><h3>Assets</h3><table><tr><th>Name</th><th>Value</th><th>Actions</th></tr>${data.assets.map(a=>`<tr><td>${a.name}</td><td>₹${a.value.toLocaleString('en-IN')}</td><td><button class="btn-edit" onclick="editAsset(${a.id})">Edit</button> <button class="btn-delete" onclick="delAsset(${a.id})">Delete</button></td></tr>`).join('')}</table></div>`;
            }

            // ANALYTICS (NEW) Can I Afford It
            if(currentPage==='analytics') {
                let inc=data.txns.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
                let exp=data.txns.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
                let save=inc-exp;
                main.innerHTML=`<div class="card"><h3>Can I Afford It?</h3>
                    <div class="form-row"><input id="target_price" type="number" placeholder="Price of item (₹)"><button class="btn-add" onclick="calculateAfford()">Calculate</button></div>
                    <div id="afford_result"></div>
                </div>
                <div class="card"><h3>Financial Summary</h3><div class="calc-box"><p>Total Income: ₹${inc.toLocaleString('en-IN')}</p><p>Total Expenses: ₹${exp.toLocaleString('en-IN')}</p><p>Monthly Savings: ₹${save.toLocaleString('en-IN')}</p></div></div>`;
            }

            // TAX (UNCHANGED)
            if(currentPage==='tax') {
                main.innerHTML=`<div class="card"><h3>Indian Income Tax Estimator (AY 2025-26 / FY 2024-25)</h3><div class="form-row"><input id="tax-income" type="number" placeholder="Annual Income (₹)"><select id="tax-regime"><option value="new">New Regime</option><option value="old">Old Regime</option></select><button class="btn-add" onclick="calculateTax()">Calculate Tax</button></div><div id="tax-result"></div></div>`;
            }
        }

        // CRUD ACTIONS
        async function addTxn(type) { let d=document.getElementById('desc').value, a=parseFloat(document.getElementById('amt').value), c=document.getElementById('cat').value, dt=document.getElementById('date').value; await api('/transactions','POST',{type,amount:a,description:d,category:c,date:dt}); loadAll(); }
        async function editTxn(id) { let a=prompt('New amount:'); await api('/transactions/'+id,'PUT',{amount:parseFloat(a)}); loadAll(); }
        async function delTxn(id) { if(confirm('Delete?')){ await api('/transactions/'+id,'DELETE'); loadAll(); } }

        async function addBudget() { let c=document.getElementById('bcat').value, a=parseFloat(document.getElementById('bamt').value); let d=new Date(); await api('/budgets','POST',{category:c,amount:a,month:d.getMonth()+1,year:d.getFullYear()}); loadAll(); }
        async function editBudget(id) { let a=prompt('New limit:'); await api('/budgets/'+id,'PUT',{amount:parseFloat(a)}); loadAll(); }

        function calculateAfford() {
            let price = parseFloat(document.getElementById('target_price').value) || 0;
            let inc = data.txns.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
            let exp = data.txns.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
            let save = inc - exp;
            if (save <= 0) { document.getElementById('afford_result').innerHTML = `<p style="color:red;">You are not saving any money currently, so you cannot afford this yet.</p>`; return; }
            let months = Math.ceil(price / save);
            document.getElementById('afford_result').innerHTML = `<p>You need to save for <strong>${months} months</strong> to afford ₹${price.toLocaleString('en-IN')} (based on your current savings of ₹${save.toLocaleString('en-IN')}/month).</p>`;
        }

        function calculateTax() {
            let income = parseFloat(document.getElementById('tax-income').value) || 0;
            let regime = document.getElementById('tax-regime').value;
            let tax = 0, deduction = 0, rebate = 0, cess = 0, surcharge = 0;
            if (income <= 0) { document.getElementById('tax-result').innerHTML = `<p style="color:red;">Please enter a valid annual income.</p>`; return; }
            if (regime === 'new') deduction = 75000; else deduction = 50000;
            let taxableIncome = Math.max(0, income - deduction); let slabMsg = "";
            if (regime === 'new') {
                if (taxableIncome <= 300000) tax = 0;
                else if (taxableIncome <= 700000) { tax = (taxableIncome - 300000) * 0.05; slabMsg = "5%"; }
                else if (taxableIncome <= 1000000) { tax = 20000 + (taxableIncome - 700000) * 0.10; slabMsg = "5% + 10%"; }
                else if (taxableIncome <= 1200000) { tax = 50000 + (taxableIncome - 1000000) * 0.15; slabMsg = "5%+10%+15%"; }
                else if (taxableIncome <= 1500000) { tax = 80000 + (taxableIncome - 1200000) * 0.20; slabMsg = "5%+10%+15%+20%"; }
                else { tax = 140000 + (taxableIncome - 1500000) * 0.30; slabMsg = "5%+10%+15%+20%+30%"; }
                if (taxableIncome <= 700000) { rebate = Math.min(tax, 25000); tax -= rebate; }
            } else {
                if (taxableIncome <= 250000) tax = 0;
                else if (taxableIncome <= 500000) { tax = (taxableIncome - 250000) * 0.05; slabMsg = "5%"; }
                else if (taxableIncome <= 1000000) { tax = 12500 + (taxableIncome - 500000) * 0.20; slabMsg = "5% + 20%"; }
                else { tax = 112500 + (taxableIncome - 1000000) * 0.30; slabMsg = "5%+20%+30%"; }
                if (taxableIncome <= 500000) { rebate = Math.min(tax, 12500); tax -= rebate; }
            }
            if (taxableIncome > 5000000) { let sr = 0.10; if(taxableIncome>50000000)sr=0.37; else if(taxableIncome>20000000)sr=0.25; else if(taxableIncome>10000000)sr=0.15; surcharge = tax*sr; tax += surcharge; }
            cess = tax * 0.04; tax += cess;
            document.getElementById('tax-result').innerHTML = `<div style="background: var(--bg); padding: 15px; border-radius: 8px; margin-top: 15px;"><p><strong>Gross Income:</strong> ₹${income.toLocaleString('en-IN')}</p><p><strong>Standard Deduction:</strong> -₹${deduction.toLocaleString('en-IN')}</p><p><strong>Taxable Income:</strong> ₹${taxableIncome.toLocaleString('en-IN')}</p><p><strong>Tax Slabs:</strong> ${slabMsg}</p><p><strong>Tax before Rebate:</strong> ₹${(tax - cess).toFixed(2)}</p>${rebate?`<p><strong>Rebate u/s 87A:</strong> -₹${rebate.toFixed(2)}</p>`:''}${surcharge?`<p><strong>Surcharge:</strong> +₹${surcharge.toFixed(2)}</p>`:''}<p><strong>Cess (4%):</strong> +₹${cess.toFixed(2)}</p><hr><h3 style="color:#11998e;">Total Tax: ₹${tax.toFixed(2)}</h3><p style="font-size:12px;">*Estimate only.</p></div>`;
        }
    </script>
